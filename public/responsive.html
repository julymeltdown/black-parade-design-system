<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive Lab — The Parade Archive</title><style>
*{box-sizing:border-box}body{margin:0;background:#d5d2ca;color:#1c1b18;font:13px system-ui,sans-serif}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:#f1eee6;border-bottom:1px solid #1c1b18;position:sticky;top:0;z-index:2}header strong{margin-right:auto;font-size:13px}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;min-height:44px;border:1px solid #b6b0a3;background:transparent;color:inherit;padding:8px}button{cursor:pointer}main{display:grid;justify-content:center;padding:24px;overflow:auto}iframe{box-sizing:content-box;display:block;background:#e9e6dd;border:1px solid #1c1b18;box-shadow:0 5px 30px #0001;flex-shrink:0}a{color:inherit;min-height:44px;display:inline-flex;align-items:center}.note{margin:0;padding:0 20px 16px;text-align:center;color:#67635b;font-size:11px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #782f2d;outline-offset:3px}
</style></head><body><header><strong>THE PARADE ARCHIVE / RESPONSIVE LAB</strong><label>Width<select id="width"><option>320</option><option>360</option><option>390</option><option>430</option><option>640</option><option>768</option><option>900</option><option>1024</option><option>1180</option><option>1440</option></select></label><label>Height<select id="height"><option>667</option><option>844</option><option>900</option></select></label><label>Page<select id="page"><option value="archive">Record</option><option value="films">Films</option><option value="community">People</option><option value="system">System</option></select></label><button id="reload">Reload preview</button><a href="/">Open the site ↗</a></header><main><iframe id="site-preview" title="Responsive archive preview"></iframe></main><p class="note">Real CSS viewport reflow inside a frame. This does not emulate physical-device touch, the mobile keyboard, or browser safe-area insets.</p><script>
const params=new URLSearchParams(location.search),w=document.getElementById('width'),h=document.getElementById('height'),p=document.getElementById('page'),frame=document.getElementById('site-preview');
w.value=[...w.options].some(o=>o.value===params.get('w'))?params.get('w'):'390';h.value=[...h.options].some(o=>o.value===params.get('h'))?params.get('h'):'844';p.value=[...p.options].some(o=>o.value===params.get('page'))?params.get('page'):'archive';
function size(){frame.style.width=w.value+'px';frame.style.height=h.value+'px';history.replaceState(null,'','?w='+w.value+'&h='+h.value+'&page='+p.value)}
function navigate(){frame.src='/#'+p.value;size()}
w.addEventListener('change',size);h.addEventListener('change',size);p.addEventListener('change',navigate);document.getElementById('reload').addEventListener('click',()=>{frame.src='/#'+p.value});navigate();
</script></body></html>
